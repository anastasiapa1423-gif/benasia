  <header class="site-header">

        <span class="chamfer" aria-hidden="true"><span class="chamfer__word"><span>b</span><span>e</span><span>n</span><span>a</span><span>s</span><span>i</span><span>a</span></span><span class="chamfer__dot">.</span></span>

        </ul>
      </nav>

      <button
        type="button"
        class="nav-toggle"
